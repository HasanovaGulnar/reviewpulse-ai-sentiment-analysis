name: Uptime check

on:
  schedule:
    # GitHub may delay scheduled runs on the free tier; this is a smoke alarm,
    # not a paging system.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the public app
        env:
          APP_URL: ${{ vars.REVIEWPULSE_APP_URL }}
        run: |
          set -u
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Set the repository variable REVIEWPULSE_APP_URL to the public app URL."
            exit 1
          fi

          base="${APP_URL%/}"
          status_url="$base/api/v2/app/status"
          home_url="$base/"

          # Streamlit Community Cloud exposes a public, app-specific status
          # endpoint. "status": 5 means the app container is running; a missing
          # app returns HTTP 404. The documented /_stcore/health path is
          # intercepted by the Cloud proxy and answers with HTML, so it is not
          # usable as an uptime signal here.
          code=$(curl -sS -o /tmp/status.json -w "%{http_code}" --max-time 30 "$status_url" || true)
          payload=$(cat /tmp/status.json 2>/dev/null || true)
          app_status=$(printf '%s' "$payload" | grep -o '"status":[[:space:]]*[0-9][0-9]*' | grep -o '[0-9][0-9]*$' || true)
          viewer_auth=$(printf '%s' "$payload" | grep -o '"viewerAuthEnabled":[[:space:]]*[a-z]*' | grep -o 'true\|false$' || true)

          echo "Status API: HTTP $code"
          echo "Payload: $payload"
          echo "App status: ${app_status:-unknown}"
          echo "Viewer auth: ${viewer_auth:-unknown}"

          # A real browser follows the anonymous session bounce and lands on
          # the app shell; curl needs a cookie jar, otherwise it loops.
          home_code=$(curl -sS -c /tmp/cookies -b /tmp/cookies -L -o /tmp/home.html -w "%{http_code}" --max-time 35 "$home_url" || true)
          home_bytes=$(wc -c < /tmp/home.html 2>/dev/null || echo 0)
          echo "Home page: HTTP $home_code ($home_bytes bytes)"

          ok=1
          if [ "$code" != "200" ]; then ok=0; echo "::error::Status API returned HTTP $code"; fi
          if [ "$app_status" != "5" ]; then ok=0; echo "::error::App is not running (status ${app_status:-missing}, expected 5)"; fi
          if [ "$viewer_auth" != "false" ]; then ok=0; echo "::error::Viewer auth is not disabled (${viewer_auth:-missing}); the app may no longer be public"; fi
          if [ "$home_code" != "200" ]; then ok=0; echo "::error::Home page returned HTTP $home_code"; fi

          {
            echo "### Uptime check"
            echo ""
            echo "| Signal | Value |"
            echo "|---|---|"
            echo "| Base URL | $base |"
            echo "| Status API | HTTP $code |"
            echo "| App status | ${app_status:-unknown} (5 = running) |"
            echo "| Viewer auth | ${viewer_auth:-unknown} |"
            echo "| Home page | HTTP $home_code, $home_bytes bytes |"
            echo ""
            echo "Payload: \`$payload\`"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$ok" = "1"
